name: Release

on:
  push:
    branches:
      - main
    paths:
      - '**.sh'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from scripts
        id: get_version
        run: |
          version=$(grep -h '^SCRIPT_VERSION=' *.sh | head -1 | cut -d'"' -f2)
          if [[ -z "$version" ]]; then
            echo "ERROR: SCRIPT_VERSION not found in any .sh file"
            exit 1
          fi
          echo "tag=$version" >> $GITHUB_OUTPUT
          echo "Detected version: $version"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag }} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag }} is new, creating release"
          fi

      - name: Create Tag and Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.get_version.outputs.tag }}"
          git push "https://${GH_TOKEN}@github.com/${{ github.repository }}.git" "${{ steps.get_version.outputs.tag }}"
          gh release create "${{ steps.get_version.outputs.tag }}" \
            --title "Release ${{ steps.get_version.outputs.tag }}" \
            --generate-notes \
            *.sh
